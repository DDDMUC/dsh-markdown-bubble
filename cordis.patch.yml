# dsh-markdown-bubble bundle patch: inserts the plugin row into the profile roster.
#
# The host half is inert: how a sent message is drawn is a browser-side
# projection, so the work lives entirely in the exported "./client" bundle.
#
# The entry name is the BARE package name on purpose: the client-module scanner
# treats it as a package specifier and resolves `<name>/package.json`, so a
# subpath entry would be cached as "not a client package" and the browser half
# would silently never load.
- insert:
    - id: dsh-markdown-bubble
      name: 'dsh-markdown-bubble'
